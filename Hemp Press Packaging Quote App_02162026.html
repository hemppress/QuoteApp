  <!--
  README — QUICK START
  1) Run locally: open this HTML file directly in a browser (double-click) OR serve with: python3 -m http.server
  2) Edit rates/config: inside APP_CONFIG (products, papers, machines, margins, add-ons, rounding policy).
  3) Add a new product type:
     - Add entry under APP_CONFIG.products with fields + default specs.
     - Add calculator function in PricingEngine.productCalculators.
     - Add field rendering rules in DynamicProductFields.
  -->
  <div id="root" class="max-w-7xl mx-auto p-4 md:p-6"></div>

  <script type="text/babel">
const APP_CONFIG = {

    '2': [{min:1,max:499,price:1.13},{min:500,max:749,price:0.83},{min:750,max:999,price:0.73},{min:1000,max:2499,price:0.68},{min:2500,max:20000,price:0.59}],
  },

  },

  },

      ]

        { id: '32pt-painted-edge', label: '32pt Painted Edge', cost: 0.32 }
      ]
    },
    brochure: { label: 'Brochure', stocks: [{id:'100lb-gloss',label:'100lb Gloss (placeholder)',cost:0.18}] },
    poster: { label: 'Poster', stocks: [{id:'100lb-cover',label:'100lb Cover (placeholder)',cost:0.45}] },

const UI = {
  input: 'w-full rounded border border-slate-600 bg-slate-800 px-2 py-1 text-sm',
  card: 'rounded-xl border border-slate-700 bg-slate-900 p-4 shadow'
};

const roundByPolicy = (value, precision, mode='ceil') => {
  const factor = Math.pow(10, precision);
  if (!Number.isFinite(value)) return 0;
  if (mode === 'nearest') return Math.round(value * factor) / factor;
  return Math.ceil((value + 1e-12) * factor) / factor;
};

const applyPricingRounding = (perPieceRaw, qty, policy) => {
  const priceEach = roundByPolicy(perPieceRaw, policy.perPiecePrecision, policy.mode);
  const totalPrice = roundByPolicy(priceEach * qty, policy.totalPrecision, policy.mode);
  return { priceEach, totalPrice };
};

const toMoney = (n) => `$${n.toFixed(APP_CONFIG.rounding.totalPrecision)}`;
const toUnit = (n) => `$${n.toFixed(APP_CONFIG.rounding.perPiecePrecision)}`;
const formatDate = (value) => value || new Date().toISOString().slice(0,10);

const tierPrice = (ps, side) => {
  const tiers = APP_CONFIG.printTiers[String(side)] || [];
  return tiers.find(t => ps >= t.min && ps <= t.max)?.price ?? (tiers[tiers.length - 1]?.price || 0);
};

const calcAddOnCost = (addOnKey, qty, custom = {}) => {
  const base = APP_CONFIG.addOns[addOnKey];
  if (!base) return 0;
  const setup = custom.setup ?? base.setup ?? 0;
  if (base.mode === 'tier') {
    const tierQty = custom.perTierQty ?? base.perTierQty ?? 1;
    const tierPriceValue = custom.perTierPrice ?? base.perTierPrice ?? 0;
    const tiersNeeded = Math.ceil(qty / Math.max(1, tierQty));
    return setup + tiersNeeded * tierPriceValue;
  }
  const perPiece = custom.perPiece ?? base.perPiece ?? 0;
  return setup + qty * perPiece;
};

const PricingEngine = {
  productCalculators: {
    packaging(input) {
      const { qty, variantStock, specs, options } = input;
      const overage = specs.customOverageQty > 0 ? 0 : specs.overagePercent;
      const effectiveQty = specs.customOverageQty > 0 ? qty + specs.customOverageQty : qty * (1 + overage / 100);
      const pressSheets = Math.max(5, Math.ceil(effectiveQty / Math.max(1, specs.out)));
      const paperCost = pressSheets * variantStock.cost;
      const printRate = specs.sides === '2' ? tierPrice(pressSheets, 2) : tierPrice(pressSheets, 1);
      const printCost = options.includePrint ? pressSheets * printRate : 0;

      const dieMachine = APP_CONFIG.dieMachines[specs.dieMachine] || APP_CONFIG.dieMachines.OG;
      const actionPerPiece = (specs.dieActionOverride > 0 ? specs.dieActionOverride : dieMachine.action) / Math.max(1, specs.up);
      const setupCost = specs.dieSetupOverride > 0 ? specs.dieSetupOverride : dieMachine.setup;
      const strippingPerPiece = (specs.windows > 0 ? dieMachine.stripping + specs.windows * 0.015 : 0);
      const dieCost = options.includeDie ? setupCost + effectiveQty * (actionPerPiece + strippingPerPiece) : 0;

      let glueCost = 0;
      if (options.includeGlue) {
        const machine = APP_CONFIG.glueMachines[specs.glueMachine] || APP_CONFIG.glueMachines.HAND;
        const glueRate = specs.glueRateOverride > 0 ? specs.glueRateOverride : (machine.rates[specs.glueMode] || 0);
        glueCost = glueRate * effectiveQty;
      }

      let prepressCost = options.includePrepress ? (specs.prepressOverrideCost > 0 ? specs.prepressOverrideCost : (50 + Math.max(0, specs.skus - 1) * 35)) : 0;
      const handlingCost = options.includeHandling ? effectiveQty * (specs.handleOverride > 0 ? specs.handleOverride : (specs.out <= 5 ? 0.02 : 0)) : 0;

      const addOnsCost = (options.selectedAddOns || []).reduce((sum, key) => sum + calcAddOnCost(key, qty, options.addOnOverrides?.[key]), 0);
      const internalCost = paperCost + printCost + dieCost + glueCost + prepressCost + handlingCost + addOnsCost;

      const margin = options.useMargin ? options.margin : 0;
      const perPieceRaw = (internalCost / Math.max(1 - margin, 0.01)) / Math.max(qty, 1);
      const rounded = applyPricingRounding(perPieceRaw, qty, APP_CONFIG.rounding);

      return {
        qty,
        effectiveQty,
        pressSheets,
        priceEach: rounded.priceEach,
        totalPrice: rounded.totalPrice,
        internal: {
          paperCost, printCost, dieCost, glueCost, prepressCost, handlingCost, addOnsCost, margin,
          internalCost
        }
      };
    },
    businessCards(input) {
      const { qty, variantStock, specs, options } = input;
      const runQty = qty * (1 + (specs.overagePercent || 0) / 100);
      const setupPrint = specs.sides === '2' ? 35 : 20;
      const inkRate = specs.sides === '2' ? 0.045 : 0.03;
      const baseMaterial = runQty * variantStock.cost;
      const printCost = setupPrint + runQty * inkRate;
      const cutCost = 15 + runQty * 0.008;
      const finishCost = (options.selectedAddOns || []).reduce((sum, key) => sum + calcAddOnCost(key, qty, options.addOnOverrides?.[key]), 0);
      const internalCost = baseMaterial + printCost + cutCost + finishCost;

      const margin = options.useMargin ? options.margin : 0;
      const perPieceRaw = (internalCost / Math.max(1 - margin, 0.01)) / Math.max(qty, 1);
      const rounded = applyPricingRounding(perPieceRaw, qty, APP_CONFIG.rounding);
      return {
        qty,
        effectiveQty: runQty,
        pressSheets: Math.ceil(runQty / 24),
        priceEach: rounded.priceEach,
        totalPrice: rounded.totalPrice,
        internal: { baseMaterial, printCost, cutCost, finishCost, margin, internalCost }
      };
    }
  },
  computeMatrix({ productType, selectedStocks, quantities, specs, options }) {
    const calculator = this.productCalculators[productType] || this.productCalculators.packaging;
    return selectedStocks.map(stock => ({
      variantKey: `${productType}::${stock.id}`,
      stock,
      rows: quantities.map(qty => calculator({ qty, variantStock: stock, specs, options }))
    }));
  }
};

function downloadText(filename, content, mime = 'text/plain') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function App() {
  const [darkMode, setDarkMode] = React.useState(true);
  const [mode, setMode] = React.useState('quote'); // quote | catalog
  const [showAdvanced, setShowAdvanced] = React.useState(false);
  const [showInternal, setShowInternal] = React.useState(false);

  const [meta, setMeta] = React.useState({
    quoteId: `Q-${Date.now().toString().slice(-6)}`,
    customerName: '',
    projectName: '',
    description: '',
    quoteDate: formatDate(),
    preparedBy: '',
    notesInternal: ''
  });

  const [productType, setProductType] = React.useState('packaging');
  const [presetType, setPresetType] = React.useState('default');
  const [quantities, setQuantities] = React.useState(APP_CONFIG.quantityPresets);
  const [customQty, setCustomQty] = React.useState('');

  const [specs, setSpecs] = React.useState({
    length: '', width: '', height: '',
    sides: '1',
    overagePercent: 10,
    customOverageQty: 0,
    up: 2,
    out: 1,
    dieMachine: 'OG',
    dieActionOverride: 0,
    dieSetupOverride: 0,
    windows: 0,
    glueMachine: 'HAND',
    glueMode: 'Fast',
    glueRateOverride: 0,
    skus: 1,
    prepressOverrideCost: 0,
    handleOverride: 0,
    cornerModel: 'cornerRoundingA',
    cardSize: '3.5" x 2"',
    paperWeight: 'Standard'
  });

  const [options, setOptions] = React.useState({
    includePrint: true,
    includeDie: true,
    includeGlue: false,
    includePrepress: true,
    includeHandling: true,
    useMargin: true,
    margin: 0.4,
    selectedAddOns: [],
    addOnOverrides: {}
  });

  const [selectedStockIds, setSelectedStockIds] = React.useState([APP_CONFIG.products.packaging.stocks[0].id]);
  const [selectedClientVariants, setSelectedClientVariants] = React.useState([]);
  const [selectedRows, setSelectedRows] = React.useState({});

  React.useEffect(() => {
    document.documentElement.classList.toggle('dark', darkMode);
  }, [darkMode]);

  React.useEffect(() => {
    const p = APP_CONFIG.products[productType];
    setSelectedStockIds([p.stocks[0].id]);
    setSelectedClientVariants([]);
    setSelectedRows({});
  }, [productType]);

  React.useEffect(() => {
    setQuantities(presetType === 'default' ? [...APP_CONFIG.quantityPresets] : [...APP_CONFIG.shortRunPresets]);
  }, [presetType]);

  const stocksForProduct = APP_CONFIG.products[productType].stocks;
  const selectedStocks = stocksForProduct.filter(s => selectedStockIds.includes(s.id));

  const validationWarnings = React.useMemo(() => {
    const warnings = [];
    if (!meta.customerName) warnings.push('Customer name is required for client-ready quote PDF.');
    if (!meta.projectName) warnings.push('Project/product name is recommended.');
    if (quantities.some(q => q <= 0)) warnings.push('Quantities must all be greater than zero.');
    if (productType === 'packaging' && (Number(specs.up) <= 0 || Number(specs.out) <= 0)) warnings.push('UP and OUT must be greater than zero.');
    if (!selectedStocks.length) warnings.push('Select at least one stock variant.');
    return warnings;
  }, [meta, quantities, specs, selectedStocks, productType]);

  const matrix = React.useMemo(() => {
    return PricingEngine.computeMatrix({ productType, selectedStocks, quantities, specs, options });
  }, [productType, selectedStocks, quantities, specs, options]);

  const toggleArray = (arr, value) => arr.includes(value) ? arr.filter(v => v !== value) : [...arr, value];
  const setMetaField = (field, value) => setMeta(prev => ({ ...prev, [field]: value }));
  const setSpecField = (field, value) => setSpecs(prev => ({ ...prev, [field]: value }));

  const exportQuoteJSON = () => {
    const payload = { meta, mode, productType, quantities, specs, options, selectedStockIds, selectedClientVariants, selectedRows, rounding: APP_CONFIG.rounding };
    downloadText(`${meta.quoteId || 'quote'}.json`, JSON.stringify(payload, null, 2), 'application/json');
  };

  const handleQuoteLoad = (event) => {
    const file = event.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        setMeta(data.meta || meta);
        setMode(data.mode || 'quote');
        setProductType(data.productType || 'packaging');
        setQuantities(data.quantities || APP_CONFIG.quantityPresets);
        setSpecs(data.specs || specs);
        setOptions(data.options || options);
        setSelectedStockIds(data.selectedStockIds || []);
        setSelectedClientVariants(data.selectedClientVariants || []);
        setSelectedRows(data.selectedRows || {});
      } catch {
        alert('Invalid quote JSON file.');
      }
    };
    reader.readAsText(file);
  };

  const matrixRowsForExport = (clientOnly = false) => {
    const allowedVariants = clientOnly && selectedClientVariants.length ? new Set(selectedClientVariants) : null;
    const rows = [];
    for (const variant of matrix) {
      if (allowedVariants && !allowedVariants.has(variant.variantKey)) continue;
      for (const row of variant.rows) {
        const rowKey = `${variant.variantKey}::${row.qty}`;
        if (clientOnly && selectedRows[variant.variantKey] && !selectedRows[variant.variantKey].includes(row.qty)) continue;
        rows.push({
          productType,
          paperStock: variant.stock.label,
          sides: specs.sides,
          finishes: options.selectedAddOns.join('|') || 'None',
          qty: row.qty,
          priceEach: row.priceEach,
          totalPrice: row.totalPrice,
          currency: APP_CONFIG.currency,
          notes: meta.description,
          rowKey
        });
      }
    }
    return rows;
  };

  const exportMatrixJSON = () => downloadText(`${meta.quoteId || 'quote'}-matrix.json`, JSON.stringify(matrixRowsForExport(mode === 'quote'), null, 2), 'application/json');

  const exportMatrixCSV = () => {
    const rows = matrixRowsForExport(mode === 'quote');
    const headers = ['productType','paperStock','sides','finishes','qty','priceEach','totalPrice','currency','notes'];
    const csv = [headers.join(',')].concat(rows.map(r => headers.map(h => `"${String(r[h] ?? '').replaceAll('"','""')}"`).join(','))).join('\n');
    downloadText(`${meta.quoteId || 'quote'}-matrix.csv`, csv, 'text/csv');
  };

  const copyClientMatrix = async () => {
    const rows = matrixRowsForExport(true);
    const text = rows.map(r => `${r.qty}\t${r.priceEach.toFixed(APP_CONFIG.rounding.perPiecePrecision)}\t${r.totalPrice.toFixed(APP_CONFIG.rounding.totalPrecision)}`).join('\n');
    try {
      await navigator.clipboard.writeText(text);
      alert('Selected client matrix copied.');
    } catch {
      alert('Clipboard unavailable in this browser context.');
    }
  };

  const generateClientPDF = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    const rows = matrixRowsForExport(true);
    if (!rows.length) return alert('Select at least one variant and one qty row for client PDF.');

    doc.setFillColor(30,41,59);
    doc.rect(0, 0, 595, 72, 'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(16);
    doc.text(APP_CONFIG.company.name, 40, 40);
    doc.setFontSize(10);
    doc.text(`Quote ID: ${meta.quoteId}`, 420, 30);
    doc.text(`Date: ${meta.quoteDate}`, 420, 46);

    doc.setTextColor(15,23,42);
    doc.setFontSize(12);
    doc.text('Client Quote', 40, 98);
    doc.setFontSize(10);
    doc.text(`Customer: ${meta.customerName || '—'}`, 40, 118);
    doc.text(`Project: ${meta.projectName || '—'}`, 40, 134);
    doc.text(`Prepared by: ${meta.preparedBy || '—'}`, 40, 150);
    doc.text(`Description: ${meta.description || '—'}`, 40, 166);

    const specText = [
      `Product Type: ${APP_CONFIG.products[productType].label}`,
      `Size: ${productType === 'packaging' ? `${specs.length || '?'} x ${specs.width || '?'} x ${specs.height || '?'}` : specs.cardSize}`,
      `Stock Variant(s): ${Array.from(new Set(rows.map(r => r.paperStock))).join(', ')}`,
      `Printing: ${specs.sides === '2' ? '2-Sided' : '1-Sided'}`,
      `Finishes: ${options.selectedAddOns.length ? options.selectedAddOns.map(k => APP_CONFIG.addOns[k]?.label || k).join(', ') : 'None'}`
    ];
    doc.text(specText, 40, 192);

    doc.autoTable({
      startY: 250,
      head: [['Stock', 'Qty', 'Price / pc', 'Total']],
      body: rows.map(r => [r.paperStock, String(r.qty), `$${r.priceEach.toFixed(APP_CONFIG.rounding.perPiecePrecision)}`, `$${r.totalPrice.toFixed(APP_CONFIG.rounding.totalPrecision)}`]),
      theme: 'grid',
      headStyles: { fillColor: [51,65,85] }
    });

    const y = doc.lastAutoTable.finalY + 24;
    doc.setFontSize(10);
    doc.text('Lead Time: Estimated 7–12 business days after art approval.', 40, y);
    doc.text('Disclaimer: Pricing is valid for 30 days and subject to material availability.', 40, y + 16);
    doc.text(`Contact: ${APP_CONFIG.company.email} | ${APP_CONFIG.company.phone} | ${APP_CONFIG.company.website}`, 40, y + 32);
    doc.save(`${meta.quoteId || 'client-quote'}.pdf`);
  };

  const DynamicProductFields = () => {
    if (productType === 'packaging') {
      return (
        <div className="grid md:grid-cols-4 gap-2">
          <label className="text-sm">Length<input className={UI.input} value={specs.length} onChange={e=>setSpecField('length', e.target.value)} /></label>
          <label className="text-sm">Width<input className={UI.input} value={specs.width} onChange={e=>setSpecField('width', e.target.value)} /></label>
          <label className="text-sm">Height<input className={UI.input} value={specs.height} onChange={e=>setSpecField('height', e.target.value)} /></label>
          <label className="text-sm">Windows<input type="number" className={UI.input} value={specs.windows} onChange={e=>setSpecField('windows', Number(e.target.value)||0)} /></label>
        </div>
      );
    }
    if (productType === 'businessCards') {
      return (
        <div className="grid md:grid-cols-3 gap-2">
          <label className="text-sm">Card Size
            <select className={UI.input} value={specs.cardSize} onChange={e=>setSpecField('cardSize', e.target.value)}>
              <option>3.5" x 2"</option><option>Square 2.5" x 2.5"</option><option>Mini 3" x 1"</option>
            </select>
          </label>
          <label className="text-sm">Paper Weight
            <select className={UI.input} value={specs.paperWeight} onChange={e=>setSpecField('paperWeight', e.target.value)}>
              <option>Standard</option><option>Premium</option><option>Luxury</option>
            </select>
          </label>
          <label className="text-sm">Corner Rounding Model
            <select className={UI.input} value={specs.cornerModel} onChange={e=>setSpecField('cornerModel', e.target.value)}>
              <option value="cornerRoundingA">Model A ($20 + $0.01/pc)</option>
              <option value="cornerRoundingB">Model B ($11 + $11/250)</option>
            </select>
          </label>
        </div>
      );
    }
    return <p className="text-sm text-slate-400">Placeholder form for {APP_CONFIG.products[productType].label}. Add calculator when ready.</p>;
  };

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap gap-2 justify-between items-center">
        <h1 className="text-2xl font-bold">Print Shop Quote App</h1>
        <div className="flex gap-2">
          <button className="px-3 py-1 rounded bg-slate-700" onClick={()=>setDarkMode(v=>!v)}>{darkMode ? 'Light' : 'Dark'} Mode</button>
          <button className="px-3 py-1 rounded bg-slate-700" onClick={()=>setShowAdvanced(v=>!v)}>{showAdvanced ? 'Hide' : 'Show'} Advanced</button>
          <button className="px-3 py-1 rounded bg-slate-700" onClick={()=>setShowInternal(v=>!v)}>{showInternal ? 'Hide' : 'Show'} Internal Costing</button>
        </div>
      </div>

      <div className={UI.card}>
        <div className="flex gap-2 items-center mb-3">
          <strong>Mode</strong>
          <button className={`px-3 py-1 rounded ${mode==='quote'?'bg-indigo-600':'bg-slate-700'}`} onClick={()=>setMode('quote')}>Quote Mode</button>
          <button className={`px-3 py-1 rounded ${mode==='catalog'?'bg-indigo-600':'bg-slate-700'}`} onClick={()=>setMode('catalog')}>Catalog Builder</button>
        </div>
        <p className="text-xs text-slate-400">Catalog mode focuses on high-volume matrix export for SustainablePrints.com ingestion.</p>
      </div>

      <section className={UI.card}>
        <h2 className="font-semibold mb-2">Step 1 — Quote metadata + product specs</h2>
        <div className="grid md:grid-cols-3 gap-2 mb-3">
          <label className="text-sm">Quote ID<input className={UI.input} value={meta.quoteId} onChange={e=>setMetaField('quoteId', e.target.value)} /></label>
          <label className="text-sm">Customer Name<input className={UI.input} value={meta.customerName} onChange={e=>setMetaField('customerName', e.target.value)} /></label>
          <label className="text-sm">Project Name<input className={UI.input} value={meta.projectName} onChange={e=>setMetaField('projectName', e.target.value)} /></label>
          <label className="text-sm">Description<input className={UI.input} value={meta.description} onChange={e=>setMetaField('description', e.target.value)} /></label>
          <label className="text-sm">Quote Date<input type="date" className={UI.input} value={meta.quoteDate} onChange={e=>setMetaField('quoteDate', e.target.value)} /></label>
          <label className="text-sm">Prepared By<input className={UI.input} value={meta.preparedBy} onChange={e=>setMetaField('preparedBy', e.target.value)} /></label>
        </div>
        <label className="text-sm block mb-3">Internal Notes (never in client PDF)
          <textarea className={UI.input + ' min-h-20'} value={meta.notesInternal} onChange={e=>setMetaField('notesInternal', e.target.value)} />
        </label>
        <div className="grid md:grid-cols-3 gap-2">
          <label className="text-sm">Product Type
            <select className={UI.input} value={productType} onChange={e=>setProductType(e.target.value)}>
              {Object.entries(APP_CONFIG.products).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </label>
          <label className="text-sm">Print Sides
            <select className={UI.input} value={specs.sides} onChange={e=>setSpecField('sides', e.target.value)}>
              <option value="1">1-Sided</option><option value="2">2-Sided</option>
            </select>
          </label>
          <label className="text-sm">Margin
            <select className={UI.input} value={options.margin} onChange={e=>setOptions(p=>({...p, margin:Number(e.target.value)}))}>
              {APP_CONFIG.margins.map(v => <option key={v} value={v}>{Math.round(v*100)}%</option>)}
            </select>
          </label>
        </div>
        <div className="mt-3"><DynamicProductFields /></div>
      </section>

      <section className={UI.card}>
        <h2 className="font-semibold mb-2">Step 2 — Options + quantities</h2>
        <div className="grid md:grid-cols-4 gap-2 mb-3">
          <label className="text-sm">Quantity Preset
            <select className={UI.input} value={presetType} onChange={e=>setPresetType(e.target.value)}>
              <option value="default">Default</option><option value="short">Short run</option>
            </select>
          </label>
          <label className="text-sm">Add Custom Qty
            <div className="flex gap-2"><input type="number" className={UI.input} value={customQty} onChange={e=>setCustomQty(e.target.value)} /><button className="px-3 bg-slate-700 rounded" onClick={()=>{ const q=Number(customQty); if(q>0&&!quantities.includes(q)) setQuantities([...quantities,q].sort((a,b)=>a-b)); setCustomQty(''); }}>Add</button></div>
          </label>
          <label className="text-sm">Overage %<input type="number" className={UI.input} value={specs.overagePercent} onChange={e=>setSpecField('overagePercent', Number(e.target.value)||0)} /></label>
          <label className="text-sm">Custom overage qty<input type="number" className={UI.input} value={specs.customOverageQty} onChange={e=>setSpecField('customOverageQty', Number(e.target.value)||0)} /></label>
        </div>
        <div className="mb-2">
          <p className="text-sm mb-1">Paper stocks (multi-select variants)</p>
          <div className="flex flex-wrap gap-2">
            {stocksForProduct.map(stock => (
              <label key={stock.id} className="px-2 py-1 rounded bg-slate-800 border border-slate-600 text-sm flex gap-2 items-center">
                <input type="checkbox" checked={selectedStockIds.includes(stock.id)} onChange={()=>setSelectedStockIds(p=>toggleArray(p, stock.id))} />
                {stock.label}
              </label>
            ))}
          </div>
        </div>
        <div className="grid md:grid-cols-3 gap-2">
          {['includePrint','includeDie','includeGlue','includePrepress','includeHandling','useMargin'].map(key => (
            <label key={key} className="text-sm flex items-center gap-2"><input type="checkbox" checked={options[key]} onChange={e=>setOptions(p=>({...p,[key]:e.target.checked}))} />{key}</label>
          ))}
        </div>
        {showAdvanced && (
          <div className="mt-3 grid md:grid-cols-4 gap-2 border-t border-slate-700 pt-3">
            <label className="text-sm">UP<input type="number" className={UI.input} value={specs.up} onChange={e=>setSpecField('up', Number(e.target.value)||1)} /></label>
            <label className="text-sm">OUT<input type="number" className={UI.input} value={specs.out} onChange={e=>setSpecField('out', Number(e.target.value)||1)} /></label>
            <label className="text-sm">Die machine
              <select className={UI.input} value={specs.dieMachine} onChange={e=>setSpecField('dieMachine', e.target.value)}>{Object.entries(APP_CONFIG.dieMachines).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select>
            </label>
            <label className="text-sm">Glue mode
              <select className={UI.input} value={specs.glueMode} onChange={e=>setSpecField('glueMode', e.target.value)}><option>Fast</option><option>Slow</option><option>Complex</option><option>Standard</option></select>
            </label>
          </div>
        )}

        <div className="mt-3">
          <p className="text-sm mb-1">Finishes / add-ons</p>
          <div className="flex flex-wrap gap-2">
            {Object.entries(APP_CONFIG.addOns).map(([k,v]) => (
              <label key={k} className="px-2 py-1 rounded bg-slate-800 border border-slate-600 text-sm flex items-center gap-2">
                <input type="checkbox" checked={options.selectedAddOns.includes(k)} onChange={()=>setOptions(p=>({...p, selectedAddOns: toggleArray(p.selectedAddOns, k)}))} />
                {v.label}
              </label>
            ))}
          </div>
        </div>
      </section>

      <section className={UI.card}>
        <h2 className="font-semibold mb-2">Step 3 — Review + compare variants</h2>
        {validationWarnings.length > 0 && <div className="mb-3 rounded border border-amber-500 bg-amber-950 p-2 text-amber-200 text-sm">{validationWarnings.map(w => <div key={w}>• {w}</div>)}</div>}
        <div className="grid lg:grid-cols-2 gap-3">
          {matrix.map(variant => (
            <div key={variant.variantKey} className="rounded border border-slate-700 overflow-hidden">
              <div className="px-3 py-2 bg-slate-800 flex justify-between items-center">
                <strong>{variant.stock.label}</strong>
                <label className="text-xs flex items-center gap-2"><input type="checkbox" checked={selectedClientVariants.includes(variant.variantKey)} onChange={()=>setSelectedClientVariants(p=>toggleArray(p, variant.variantKey))} />Include variant in client PDF</label>
              </div>
              <table className="w-full text-sm">
                <thead className="bg-slate-900"><tr><th className="p-2 text-left">Use</th><th>Qty</th><th>Price/pc</th><th>Total</th>{showInternal && <th>Internal</th>}</tr></thead>
                <tbody>
                  {variant.rows.map(row => {
                    const checked = (selectedRows[variant.variantKey] || []).includes(row.qty);
                    return (
                      <tr key={row.qty} className="border-t border-slate-800">
                        <td className="p-2"><input type="checkbox" checked={checked} onChange={()=>setSelectedRows(prev => ({...prev, [variant.variantKey]: toggleArray(prev[variant.variantKey] || [], row.qty)}))} /></td>
                        <td>{row.qty.toLocaleString()}</td>
                        <td>{toUnit(row.priceEach)}</td>
                        <td>{toMoney(row.totalPrice)}</td>
                        {showInternal && <td className="text-xs text-slate-400">{toMoney(roundByPolicy(row.internal.internalCost, 2, 'nearest'))}</td>}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          ))}
        </div>
      </section>

      <section className={UI.card}>
        <h2 className="font-semibold mb-2">Step 4 — Final selection + outputs</h2>
        <div className="flex flex-wrap gap-2">
          <button className="px-3 py-1 rounded bg-indigo-600" onClick={generateClientPDF}>Client Quote PDF</button>
          <button className="px-3 py-1 rounded bg-slate-700" onClick={copyClientMatrix}>Copy selected matrix</button>
          <button className="px-3 py-1 rounded bg-slate-700" onClick={exportQuoteJSON}>Export quote JSON</button>
          <label className="px-3 py-1 rounded bg-slate-700 cursor-pointer">Load quote JSON<input type="file" accept="application/json" className="hidden" onChange={handleQuoteLoad} /></label>
          <button className="px-3 py-1 rounded bg-slate-700" onClick={exportMatrixJSON}>Export matrix JSON</button>
          <button className="px-3 py-1 rounded bg-slate-700" onClick={exportMatrixCSV}>Export matrix CSV</button>
        </div>
        <p className="text-xs text-slate-400 mt-2">Client outputs intentionally exclude margin, cost breakdowns, and internal notes.</p>
      </section>
    </div>
  );
}

function boot() {
  const root = document.getElementById('root');
  ReactDOM.createRoot(root).render(<App />);
}
window.addEventListener('load', boot);
  </script>
</body>
</html>
